# Render Blueprint: one free web service built from the Dockerfile.
# Render → New → Blueprint → pick this repo. It asks for the two secrets marked `sync: false`.
services:
  - type: web
    name: build-or-not
    runtime: docker
    plan: free
    region: singapore # closest to India; oregon / ohio / virginia / frankfurt also work
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets: typed into Render's dashboard, never committed.
      - key: MONGODB_URI # mongodb+srv://USER:PASSWORD@cluster.xxxxx.mongodb.net/build-or-not?retryWrites=true&w=majority
        sync: false
      - key: GROQ_API_KEY # the site's own key: powers the free tier
        sync: false
      - key: IP_HASH_SECRET # hashes visitor IPs for the daily limits; Render generates it
        generateValue: true
      # Proxies in front of the app. Check the "[visitor IP]" line in the log after your first
      # visit and set the number it suggests.
      - key: TRUST_PROXY
        value: "1"
      - key: PROVIDERS
        value: groq
      - key: FREE_RUNS_PER_DAY
        value: "3"
      - key: OWN_RUNS_PER_DAY
        value: "20"
      - key: ALLOW_OWN_KEYS
        value: "true"
