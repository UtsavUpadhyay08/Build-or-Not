services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10

  app:
    build: .
    profiles: ["app"] # `docker compose up -d mongo` for dev; `docker compose --profile app up --build` for everything
    ports:
      - "4100:4100"
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017/build-or-not
      # This container runs on your own machine, so by default it behaves like `npm run dev` for
      # sign-in: the email code shows on screen, no email service needed. To try it exactly as
      # Render runs it: set APP_NODE_ENV=production in .env (then email needs RESEND_API_KEY).
      NODE_ENV: ${APP_NODE_ENV:-development}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
